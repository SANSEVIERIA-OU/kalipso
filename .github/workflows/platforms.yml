name: macOS and Windows
on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:
  workflow_call: # Used by the release workflow.
permissions:
  contents: read
jobs:
  speech-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Italian and English speech (synthetic, no microphone)
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y espeak-ng ffmpeg
          python3 tools/make-speech-fixtures.py speech-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speech-fixtures
          path: speech-fixtures
          retention-days: 7
  build:
    needs: speech-fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            host: mac
            arch: clang_64
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            # aqt 3.3.0 cannot resolve the Qt 6.11+ Windows repository layout.
            # Upstream fix pinned until included in a published release; tracked in #1.
            aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/versions
        id: versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # Use the same full-ICU Node as browser checks, not the runner's system ICU.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ steps.versions.outputs.qt }}
          aqtversion: ==${{ steps.versions.outputs.aqt }}
          aqtsource: ${{ matrix.aqtsource }}
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: qtmultimedia
          cache: true
      - name: Install pinned CMake
        run: python -m pip install cmake==${{ steps.versions.outputs.cmake }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        id: native_build
        run: cmake --build build --config Release --parallel 2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && steps.native_build.outcome == 'success'
        with:
          name: speech-fixtures
          path: speech-fixtures
      - name: Download and recognize with native Vosk and Moonshine
        if: always() && steps.native_build.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then probe=build/Release/speech_runtime_probe.exe; else probe=build/speech_runtime_probe; fi
          "$probe" vosk it speech-fixtures
          "$probe" moonshine en speech-fixtures
      - name: UI test failure details
        if: failure()
        run: python -c "from pathlib import Path; p=Path('build/ui-results.txt'); print(p.read_text(encoding='utf-8') if p.exists() else 'No UI test log was created')"
      - name: Collect runtime notices
        run: python tools/package-qt-notices.py ${{ steps.versions.outputs.qt }} artifacts/runtime-notices
      - name: macOS bundle
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/kalipso.app
          mkdir -p build/kalipso.app/Contents/Resources/licenses
          cp -R artifacts/runtime-notices/. build/kalipso.app/Contents/Resources/licenses/
          mkdir -p build/kalipso.app/Contents/Resources/licenses/fonts
          cp src/fonts/*.txt build/kalipso.app/Contents/Resources/licenses/fonts/
          codesign --force --deep --sign - --entitlements packaging/macos/entitlements.plist build/kalipso.app
          build/kalipso.app/Contents/MacOS/kalipso --demo --quit-after 1000
          mkdir -p artifacts
          tar -czf artifacts/kalipso-macos.tar.gz -C build kalipso.app
          # The disk image people expect on a Mac: the app beside a link to Applications, to drag it there.
          mkdir -p dmg && cp -R build/kalipso.app dmg/Kalipso.app && ln -s /Applications dmg/Applications
          hdiutil create -volname Kalipso -srcfolder dmg -ov -format UDZO artifacts/kalipso-macos.dmg
          # Right after hdiutil create the image can still be busy ("Resource temporarily unavailable"):
          # verify again for a while before giving up.
          for attempt in 1 2 3 4 5 6; do hdiutil verify artifacts/kalipso-macos.dmg && break; [ "$attempt" = 6 ] && exit 1; sleep 10; done
      - name: Screens on macOS (light and dark)
        # What Kalipso looks like on a real Mac, for visual review: its own windows (Qt's grab) and the whole
        # screen with the system's title bar. A missing picture does not fail the build.
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          for scheme in light dark; do
            # The system's own switch; the preference alone does not reach a running session.
            dark=$([ "$scheme" = dark ] && echo true || echo false)
            # At most 20 seconds: a permission prompt nobody answers would wait for ever.
            perl -e 'alarm 20; exec @ARGV' osascript -e \
              "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark" \
              || echo "::warning::Could not switch macOS to $scheme"
            build/kalipso.app/Contents/MacOS/kalipso --screenshot "$PWD/screens/$scheme"
            build/kalipso.app/Contents/MacOS/kalipso --demo --quit-after 6000 &
            sleep 4
            screencapture -x "$PWD/screens/$scheme/screen.png" || echo "::warning::No screen capture on macOS"
            wait
          done
          perl -e 'alarm 20; exec @ARGV' osascript -e \
            'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
          ls -R screens
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build --config Release --prefix artifacts/kalipso
          windeployqt --release artifacts/kalipso/bin/kalipso.exe
          # App-local Microsoft C++ runtime, so the portable folder starts on a clean machine.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Copy-Item "$($crt.FullName)\*.dll" artifacts/kalipso/bin/
          Copy-Item -Recurse artifacts/runtime-notices artifacts/kalipso/share/licenses/third-party
          $app = Start-Process artifacts/kalipso/bin/kalipso.exe -ArgumentList '--demo', '--quit-after', '1500' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "The packaged app exited with code $($app.ExitCode)" }
      - name: Screens on Windows (light and dark)
        # What Kalipso looks like on a real Windows, for visual review: its own windows (Qt's grab) and the
        # whole screen with Windows' title bar. A missing picture does not fail the build.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $key -Force | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($scheme in 'light', 'dark') {
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value ([int]($scheme -eq 'light')) -Type DWord
            $folder = Join-Path $PWD "screens\$scheme"
            Start-Process artifacts/kalipso/bin/kalipso.exe -ArgumentList '--screenshot', $folder -Wait
            $app = Start-Process artifacts/kalipso/bin/kalipso.exe -ArgumentList '--demo', '--quit-after', '6000' -PassThru
            Start-Sleep -Seconds 4
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $folder 'screen.png'))
            $app.WaitForExit()
          }
          Get-ChildItem -Recurse screens | Select-Object FullName, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kalipso-screens-${{ matrix.os }}
          path: screens
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7 # Intermediate files: releases keep their own copies.
          name: kalipso-${{ matrix.os }}
          path: |
            artifacts/kalipso-macos.tar.gz
            artifacts/kalipso-macos.dmg
            artifacts/kalipso
  installers:
    # The Windows installer, made on Linux with wixl as the release makes it (tools/make-msi.sh), from
    # the folder the Windows build tested: this version, and a fake previous one to upgrade from.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalipso-windows-2022
          path: windows
      - name: Make this version's installer and the previous one's
        run: |
          version=$(sed -n 's/^project(Kalipso VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          major=${version%.*} step=${version#*.}
          if [ "$step" -gt 0 ]; then previous="$major.$((step - 1))"; else previous="$((major - 1)).9"; fi
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -euo pipefail -c '
            apt-get update -qq && apt-get install -y -qq wixl imagemagick python3 >/dev/null
            tools/make-msi.sh windows/kalipso "$0" installers/new
            tools/make-msi.sh windows/kalipso "$1" installers/old' "$version" "$previous"
          sudo chown -R "$(id -u):$(id -g)" installers
          echo "$version" > installers/version
          ls -lR installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7 # Intermediate files: releases keep their own copies.
          name: kalipso-installers
          path: installers
  installer-on-windows:
    # What someone on Windows does: install an older Kalipso, upgrade it with this installer, start it,
    # remove it. The same checks as tools/test-msi-wine.sh, on a real Windows.
    needs: installers
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalipso-installers
          path: installers
      - name: Install, upgrade, start and remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content installers/version).Trim()
          $new = (Get-ChildItem installers/new/*.msi).FullName
          $old = (Get-ChildItem installers/old/*.msi).FullName
          function Msi($action, $file, $log) {
            $run = Start-Process msiexec.exe -ArgumentList $action, "`"$file`"", '/qn', '/l*v', $log -PassThru
            if (-not $run.WaitForExit(300000)) { Stop-Process -Id $run.Id -Force; Get-Content $log -Tail 40; throw "msiexec $action did not end within 5 minutes" }
            if ($run.ExitCode -notin 0, 3010) { Get-Content $log -Tail 40; throw "msiexec $action ended with $($run.ExitCode)" }
          }
          function Entries {
            @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'Kalipso*' })
          }
          function Shortcuts {
            @(Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu", "$env:APPDATA\Microsoft\Windows\Start Menu" `
              -Recurse -Filter 'Kalipso.lnk' -ErrorAction SilentlyContinue)
          }
          $program = Join-Path $env:ProgramFiles 'Kalipso'
          $kept = Join-Path $env:APPDATA 'sansevieria-ou\kept.txt'
          Msi '/i' $old old.log
          "older: $((Entries).DisplayVersion -join ', ')"
          New-Item -ItemType Directory -Force (Split-Path $kept) | Out-Null
          Set-Content $kept 'my script'
          Msi '/i' $new new.log
          $entries = Entries
          "installed: $($entries.DisplayVersion -join ', ')"
          if ($entries.Count -ne 1) { throw "Expected one Kalipso entry, found $($entries.Count)" }
          if (-not $entries[0].DisplayVersion.StartsWith($version)) { throw "Installed $($entries[0].DisplayVersion), expected $version" }
          if (-not (Test-Path "$program\bin\kalipso.exe")) { throw 'No kalipso.exe in Program Files' }
          if ((Shortcuts).Count -eq 0) { throw 'No Start menu item' }
          # At most a minute: if the app does not quit by itself, the screen shows why (a dialog?).
          $app = Start-Process "$program\bin\kalipso.exe" -ArgumentList '--demo', '--quit-after', '1500' -PassThru
          if (-not $app.WaitForExit(60000)) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force installer-debug | Out-Null
            $bitmap.Save("$PWD\installer-debug\still-running.png")
            Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table | Out-String | Write-Host
            Stop-Process -Id $app.Id -Force
            throw 'The installed app did not quit by itself within a minute (see installer-debug/still-running.png)'
          }
          if ($app.ExitCode -ne 0) { throw "The installed app exited with $($app.ExitCode)" }
          'app: started and quit'
          Msi '/x' $new remove.log
          if ((Entries).Count -ne 0) { throw 'Still in the installed programs' }
          if (Test-Path "$program\bin\kalipso.exe") { throw 'Program files left behind' }
          if ((Shortcuts).Count -ne 0) { throw 'Start menu item left behind' }
          if ((Get-Content $kept) -ne 'my script') { throw "The user's files were removed" }
          "removed; the user's files are still there"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          retention-days: 7 # Intermediate files: releases keep their own copies.
          name: kalipso-installer-debug
          path: |
            installer-debug
            *.log
          if-no-files-found: ignore
