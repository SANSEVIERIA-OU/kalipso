name: Release
# Every update is a version (tools/version.py, docs/releasing.md), and every version is released for every
# system (owner's decision, 3 November 2026). When a push to main brings a version that has no tag yet,
# this workflow tags that commit, builds every package with SHA256SUMS and a build provenance
# attestation per file, publishes the GitHub release as latest, and updates AUR. A tag pushed by hand
# releases the same way. A push whose version is already released does nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    # Which version this push releases, if any. A new version on main is tagged here.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag="v$(sed -n 's/^project(Kalipso VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # The commit the tag names (an annotated tag lists it as ^{}), if the tag exists.
            tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -1 | cut -f1)
            if [ -z "$tagged" ]; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            elif [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::warning::$tag already names another commit and has no release; release it by hand."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Releasing $tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev qt6-l10n-tools qt6-tools-dev libpipewire-0.3-dev pkg-config dpkg-dev rpm
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
      - name: Check the tag matches the version everywhere
        run: python3 tools/version.py check "$TAG"
      - name: Package
        run: |
          (cd build && cpack -G "DEB;RPM;TGZ")
          # The companion alone, for people who use only the Plasma widget or the GNOME extension.
          packaging/companion/make-archive.sh build/kalipso-engine "${TAG#v}" build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7 # Intermediate files: releases keep their own copies.
          name: kalipso-linux
          path: |
            build/kalipso_*.deb
            build/kalipso-*.rpm
            build/kalipso-*.tar.gz
            build/kalipso-companion-*.tar.gz
  arch:
    # The installed files built on Arch Linux against Arch's own Qt: what kalipso-bin on AUR unpacks.
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build in an Arch Linux container
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed cmake ninja python qt6-base qt6-svg qt6-tools libpipewire pipewire hicolor-icon-theme >/dev/null
            /src/tools/build-arch-tarball.sh /src "${0#v}" /out' "$TAG"
          sudo chown -R "$(id -u):$(id -g)" out
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7 # Intermediate files: releases keep their own copies.
          name: kalipso-arch
          path: out/kalipso-*-archlinux-x86_64.tar.zst
  platforms:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/platforms.yml
    with:
      # Owner accepted the measured macOS startup overrun for 3.1 on 7 November 2026.
      # Other versions, platforms, workloads and invalid results retain every gate.
      allow_macos_startup_over_budget: ${{ needs.version.outputs.tag == 'v3.1' }}
  desktop:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: [version, linux, arch, platforms, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect packages
        run: |
          gh run download "$GITHUB_RUN_ID" --dir downloads
          mkdir dist
          cp downloads/kalipso-linux/* dist/
          cp downloads/kalipso-arch/* dist/
          cp downloads/kalipso-desktop-packages/* dist/
          cp downloads/kalipso-macos-26/kalipso-macos.tar.gz "dist/kalipso-$TAG-macos-arm64.tar.gz"
          cp downloads/kalipso-macos-26/kalipso-macos.dmg "dist/kalipso-$TAG-macos-arm64.dmg"
          (cd downloads/kalipso-windows-2022/kalipso && zip -qr "$GITHUB_WORKSPACE/dist/kalipso-$TAG-windows-x64.zip" .)
          # The Windows installer, from the same folder the Windows job built and started (tools/make-msi.sh),
          # with Debian 13's msitools (0.106), the version the installer was checked with.
          docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -euo pipefail -c '
            apt-get update -qq && apt-get install -y -qq wixl imagemagick python3 >/dev/null
            tools/make-msi.sh downloads/kalipso-windows-2022/kalipso "${0#v}" dist' "$TAG"
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attest where each file was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        id: release
        run: |
          version=${TAG#v}
          cat > notes.md <<EOF
          Kalipso $version. Installation guide: https://github.com/$GH_REPO#install

          **The packages are not signed yet.** Check a download with \`SHA256SUMS\` or with
          \`gh attestation verify <file> -R $GH_REPO\` (it proves the file was built here, from this version's commit).
          - **Windows:** the .msi installs Kalipso for every user and upgrades an older one in place; the .zip
            runs without installing. If SmartScreen says "Windows protected your PC", choose *More info*,
            then *Run anyway*.
            With Smart App Control on, Windows blocks unsigned apps and offers no way round it.
          - **macOS:** open the .dmg and drag Kalipso to Applications. Open it once, then go to
            *System Settings → Privacy & Security* and choose
            *Open Anyway* (within about an hour).
          - **Linux:** the .deb is for Debian 13 and Ubuntu 24.04 or newer, the .rpm for current Fedora releases;
            on Arch, install \`kalipso-bin\` (or \`kalipso\`) from AUR. Each Linux package also installs the
            Plasma widget, the GNOME extension and the KWin script; their separate files are for using them
            without the app.
          EOF
          python3 - "$version" >> notes.md <<'PY'
          import re
          import sys
          from pathlib import Path
          changes = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(r'^## ' + re.escape(sys.argv[1]) + r' [^\n]*\n(.*?)(?=^## |\Z)',
                              changes, re.MULTILINE | re.DOTALL)
          if not section:
              raise SystemExit('Missing changelog for this release')
          print('\n## Changes\n' + section.group(1).strip())
          PY
          gh release create "$TAG" dist/* --verify-tag --latest --title "Kalipso $version" \
            --notes-file notes.md --generate-notes
  aur:
    # kalipso-bin and kalipso on AUR follow every version.
    needs: [version, publish]
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit
