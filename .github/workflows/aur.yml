name: AUR
# Publishes Kalipso's Arch packages to AUR at a published version: `kalipso-bin` (the files the release
# built on Arch) and `kalipso` (built from the source). The release workflow calls it for 0.1 and every
# X.0; it can also be run by hand for a published version. `kalipso-git` is no longer published: AUR
# carries published versions only. Needs the secret AUR_SSH_KEY: the private SSH key of the AUR account
# that maintains the packages. Without it the job warns and stops; nothing else depends on it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to publish (2.0 or v2.0)
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        description: Published version, for example 1.0
        type: string
        required: true
    secrets:
      AUR_SSH_KEY:
        required: false
permissions:
  contents: read
jobs:
  aur:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Write the PKGBUILDs
        run: |
          set -euo pipefail
          # The release passes its tag (v2.0); the URLs and pkgver want the version alone.
          VERSION="${VERSION#v}"
          test -n "$VERSION"
          # pkgrel: 1 for a new version. When a published version is built again (other files, the same
          # number), one more than on AUR, so that pacman offers it to whoever has the earlier build.
          pkgrel_for() { # <package> <sha256 of its new source>
            rm -rf "current-$1"
            git clone -q --depth 1 "https://aur.archlinux.org/$1.git" "current-$1" 2>/dev/null || true
            local current="current-$1/PKGBUILD"
            if [ ! -f "$current" ] || [ "$(sed -n 's/^pkgver=//p' "$current")" != "$VERSION" ]; then echo 1; return; fi
            local rel; rel=$(sed -n 's/^pkgrel=//p' "$current")
            if grep -q "^sha256sums=('$2')" "$current"; then echo "$rel"; else echo $((rel + 1)); fi
          }
          write() { # <package> <sha256>
            mkdir -p "aur/$1"
            sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=$(pkgrel_for "$1" "$2")/" \
              -e "s/^sha256sums=.*/sha256sums=('$2')/" "packaging/arch/$1/PKGBUILD" > "aur/$1/PKGBUILD"
          }
          curl -fsSL -o source.tar.gz "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$VERSION.tar.gz"
          write kalipso "$(sha256sum source.tar.gz | cut -d' ' -f1)"
          # kalipso-bin: the files the release built on Arch, attached to the release.
          curl -fsSL -o binary.tar.zst \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/kalipso-$VERSION-archlinux-x86_64.tar.zst"
          write kalipso-bin "$(sha256sum binary.tar.zst | cut -d' ' -f1)"
          grep -H "^pkgver=\|^pkgrel=\|^sha256sums=" aur/*/PKGBUILD
      - name: Write .SRCINFO (makepkg in an Arch container)
        run: |
          docker run --rm -v "$PWD/aur:/aur" archlinux:base-devel bash -c \
            'useradd -m builder && chown -R builder /aur && for dir in /aur/*/; do su builder -c "cd $dir && makepkg --printsrcinfo > .SRCINFO"; done'
          sudo chown -R "$(id -u):$(id -g)" aur
          cat aur/*/.SRCINFO
      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::warning::No AUR_SSH_KEY secret: the AUR packages were not updated."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # Talk to AUR only: the Ed25519 fingerprint published on aur.archlinux.org.
          ssh-keyscan -t ed25519 aur.archlinux.org > /tmp/aur_host 2>/dev/null
          ssh-keygen -lf /tmp/aur_host | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' \
            || { echo "::error::Unexpected SSH fingerprint for aur.archlinux.org: not publishing."; exit 1; }
          cat /tmp/aur_host >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          for dir in aur/*/; do
            package=$(basename "$dir")
            git clone "ssh://aur@aur.archlinux.org/$package.git" "repo-$package"
            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "repo-$package/"
            (
              cd "repo-$package"
              git config user.name "Kalipso release"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then echo "$package is already up to date"; exit 0; fi
              git commit -m "$(sed -n 's/^pkgver=//p' PKGBUILD)-$(sed -n 's/^pkgrel=//p' PKGBUILD)"
              git push origin HEAD:master
            )
          done
