name: Native build and tests
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        qt: [distribution, latest-stable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/versions
        id: versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Check source distribution
        run: python3 tools/check-repository.py
      - name: Check the version is the same everywhere
        run: python3 tools/version.py check
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-svg-dev qt6-l10n-tools qt6-tools-dev libpipewire-0.3-dev pkg-config pipewire-bin wireplumber gstreamer1.0-tools gstreamer1.0-pipewire gstreamer1.0-plugins-base desktop-file-utils appstream dbus-x11 libglib2.0-bin gjs qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick qt6-declarative-dev-tools qt6-qpa-plugins xvfb xauth
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: matrix.qt == 'latest-stable'
        with:
          version: ${{ steps.versions.outputs.qt }}
          aqtversion: ==${{ steps.versions.outputs.aqt }}
          host: linux
          arch: linux_gcc_64
          cache: true
      - name: Install pinned CMake
        run: python -m pip install cmake==${{ steps.versions.outputs.cmake }}
      - name: Configure
        # QT_ROOT_DIR is set only by the latest-stable Qt installer; the distribution lane uses system Qt.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ${QT_ROOT_DIR:+-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR}
      - name: Confirm the Qt version under test
        run: grep -E "^Qt6_DIR" build/CMakeCache.txt
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: UI tests on a real X11 server
        # Offscreen tests skip real screen sampling; run the whole suite on X11 too.
        if: matrix.qt == 'distribution'
        run: xvfb-run -a -s '-screen 0 1280x900x24' env QT_QPA_PLATFORM=xcb build/ui_tests
      - name: Check ASR benchmark metrics
        run: |
          python3 -m unittest discover -s benchmarks/asr -p 'test_*.py'
          python3 -m py_compile benchmarks/asr/*.py
          cmake -S benchmarks/asr -B build-asr-check -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-asr-check --parallel 2
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/*.desktop
          appstreamcli validate --no-net packaging/*.metainfo.xml
      - name: Smoke test
        run: QT_QPA_PLATFORM=offscreen build/kalipso --demo --prompter --quit-after 1000
      - name: Startup time within budget
        # About three times the p95 measured on a developer machine (docs/performance.md): it catches a
        # startup that waits on something new (a network call, a model load), not runner noise.
        run: python3 tools/measure-startup.py build/kalipso --runs 15 --budget-p95 2000
      - name: Repeated Linux performance measurements
        if: matrix.qt == 'distribution'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y espeak-ng ffmpeg
          python3 tools/make-speech-fixtures.py artifacts/speech-fixtures
          python3 tests/performance_metrics_test.py
          xvfb-run -a -s '-screen 0 1280x900x24' env QT_QPA_PLATFORM=xcb python3 tools/run-performance.py --fixtures artifacts/speech-fixtures --output artifacts/performance
          python3 tools/performance-report.py artifacts/performance --check > artifacts/performance/summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.qt == 'distribution'
        with:
          name: performance-linux
          path: artifacts/performance
          retention-days: 30
          if-no-files-found: warn
      - name: Verify design token generation
        run: |
          python3 tools/generate-design-tokens.py
          git diff --exit-code -- design src/design_tokens.h src/icons/generated site/assets/tokens.css site/assets/mark.svg site/assets/tracker.mjs site/assets/unicode-tokens.mjs desktop/gnome/tokens.js desktop/gnome/stylesheet.css desktop/plasma/contents/ui/Tokens.js packaging/io.github.sansevieria_ou.kalipso.svg
      - name: Package and check the companion download
        run: |
          packaging/companion/make-archive.sh build/kalipso-engine 0.0 companion
          tar -xzf companion/kalipso-companion-v0.0-linux-x86_64.tar.gz -C companion
          home="$PWD/companion/home"
          env -u XDG_DATA_HOME HOME="$home" companion/kalipso-companion-v0.0-linux-x86_64/install
          test -x "$home/.local/bin/kalipso-engine"
          grep -qx "Exec=\"$home/.local/bin/kalipso-engine\" --serve" \
            "$home/.local/share/dbus-1/services/io.github.sansevieria_ou.Kalipso.Engine.service"
          env -u XDG_DATA_HOME HOME="$home" "$home/.local/bin/kalipso-engine" --list-models | grep -q '^it  Italiano  vosk'
          env -u XDG_DATA_HOME HOME="$home" "$home/.local/bin/kalipso-engine" --download --language xx && exit 1 || true
      - name: Install to staging
        run: DESTDIR="$PWD/artifacts/stage" cmake --install build --prefix /usr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7 # Intermediate files: releases keep their own copies.
          name: linux-development-build-${{ matrix.qt }}
          path: artifacts/stage
