name: Retry jobs no runner took
# GitHub sometimes cancels a job because no hosted runner was free: "The job was not acquired by Runner
# of type hosted even after multiple attempts", mostly macOS. Since every update is a release, a run that
# ends that way is run again, its failed jobs only, up to three more times. Any other failure is left
# for a person.
on:
  workflow_run:
    workflows: [Release, macOS and Windows]
    types: [completed]
permissions:
  actions: write
  checks: read
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Run the failed jobs again if no runner took one
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "cancelled" or .conclusion == "failure") | .id')
          for job in $jobs; do
            if gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" --jq '.[].message' |
                grep -q 'not acquired by Runner'; then
              echo "Job $job found no runner: running the failed jobs of run $RUN again."
              gh run rerun "$RUN" --failed -R "$GITHUB_REPOSITORY"
              exit 0
            fi
          done
          echo "No job failed for want of a runner: nothing to retry."
